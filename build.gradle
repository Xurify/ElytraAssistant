plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.diffplug.spotless' version '8.8.0'
}

spotless {
    java {
        googleJavaFormat()
    }
    json {
        target 'src/**/*.json'
        simple().indentWithSpaces(2)
    }
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://repo.spongepowered.org/maven" }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "elytraassistant" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_compatibility", project.minecraft_compatibility
    inputs.property "cloth_config_version", project.cloth_config_version
    inputs.property "modmenu_version", project.modmenu_version
    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_compatibility": project.minecraft_compatibility,
                "cloth_config_version": project.cloth_config_version,
                "modmenu_version": project.modmenu_version
        )
    }
}

tasks.register("verifyModMetadata") {
    dependsOn processResources
    doLast {
        def metadata = file("${layout.buildDirectory.get()}/resources/main/fabric.mod.json").text
        def expectedEntries = [
                "\"minecraft\": \"${project.minecraft_compatibility}\"",
                "\"cloth-config\": \">=${project.cloth_config_version}\"",
                "\"modmenu\": \">=${project.modmenu_version}\""
        ]

        expectedEntries.each { entry ->
            if (!metadata.contains(entry)) {
                throw new GradleException("Generated fabric.mod.json is missing ${entry}")
            }
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("verifyModMetadata")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

def getArchiveName = { extension ->
    "${project.archives_base_name}-${project.modding_api}-${project.mod_version}-mc${project.minecraft_version}${extension ? '.' + extension : ''}"
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    archiveFileName = getArchiveName("jar")
}

tasks.named("jar") { archiveFileName = getArchiveName("jar") }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") { archiveFileName = getArchiveName("sources.jar") }

def createArchive = { TaskContainer tasks, String type, String extension ->
    tasks.create("create${type.capitalize()}", type == "tar" ? Tar : Zip) {
        archiveFileName = getArchiveName(extension)
        destinationDirectory = file("${buildDir}/distributions")
        if (type == "tar") compression = Compression.GZIP
        from(projectDir) {
            include 'src/**'
            include 'gradle/**'
            include 'build.gradle'
            include 'gradle.properties'
            include 'gradlew'
            include 'gradlew.bat'
            include 'LICENSE'
            include 'README.md'
            // Add any other files or directories you want to include
        }
    }
}

createArchive(tasks, "zip", "zip")
createArchive(tasks, "tar", "tar.gz")

task createDistributions {
    dependsOn tasks.createZip, tasks.createTar
}

build.dependsOn createDistributions
